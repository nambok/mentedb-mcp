name: Build and Publish npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-latest
          - platform: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-latest
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
          - platform: linux-x64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
          cache-on-failure: true

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
          pip3 install cargo-zigbuild
          sudo snap install zig --classic --beta

      - name: Install musl tools (Linux x64)
        if: matrix.platform == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y musl-tools perl make

      - name: Install protobuf compiler (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install protobuf
          else
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Build (Linux ARM64)
        if: matrix.platform == 'linux-arm64'
        run: cargo zigbuild --release --target ${{ matrix.target }} --features vendored-openssl

      - name: Build (Linux x64)
        if: matrix.platform == 'linux-x64'
        run: cargo build --release --target ${{ matrix.target }} --features vendored-openssl

      - name: Build (other)
        if: matrix.platform != 'linux-arm64' && matrix.platform != 'linux-x64'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/mentedb-mcp staging/
          chmod +x staging/mentedb-mcp

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir staging
          copy target\${{ matrix.target }}\release\mentedb-mcp.exe staging\

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}
          path: staging/

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # npm trusted publishing: the registry accepts this job's OIDC identity,
    # so no long-lived token is stored in the repo.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an npm with trusted publishing support
        run: npm install -g npm@latest

      - name: Sync versions from Cargo.toml
        run: node scripts/sync-npm-version.js

      - name: Download darwin-arm64
        uses: actions/download-artifact@v8
        with:
          name: binary-darwin-arm64
          path: npm/darwin-arm64/bin/

      - name: Download darwin-x64
        uses: actions/download-artifact@v8
        with:
          name: binary-darwin-x64
          path: npm/darwin-x64/bin/

      - name: Download linux-arm64
        uses: actions/download-artifact@v8
        with:
          name: binary-linux-arm64
          path: npm/linux-arm64/bin/

      - name: Download linux-x64
        uses: actions/download-artifact@v8
        with:
          name: binary-linux-x64
          path: npm/linux-x64/bin/

      - name: Download win32-x64
        uses: actions/download-artifact@v8
        with:
          name: binary-win32-x64
          path: npm/win32-x64/bin/

      - name: Set executable permissions
        run: |
          chmod +x npm/darwin-arm64/bin/mentedb-mcp
          chmod +x npm/darwin-x64/bin/mentedb-mcp
          chmod +x npm/linux-arm64/bin/mentedb-mcp
          chmod +x npm/linux-x64/bin/mentedb-mcp
          chmod +x npm/mentedb-mcp/bin/mentedb-mcp

      - name: Copy README to npm package
        run: cp README.md npm/mentedb-mcp/README.md

      - name: Publish packages
        run: |
          # Platform packages first so the main package never points at a missing binary.
          # Skip only a version that is genuinely already on the registry; any other
          # failure (an auth error answers 404) must fail the job.
          for pkg in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64 mentedb-mcp; do
            if [ "$pkg" = mentedb-mcp ]; then
              # Publish the main package only once the registry serves every
              # platform package at this version, so an install right after the
              # release resolves the binary it depends on.
              version=$(node -p 'require("./npm/mentedb-mcp/package.json").version')
              # Registry propagation has taken over 5 minutes, so wait up to 15.
              for plat in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
                for i in $(seq 1 90); do
                  [ "$(npm view "@mentedb/mcp-$plat@$version" version --prefer-online 2>/dev/null)" = "$version" ] && break
                  [ "$i" = 90 ] && { echo "@mentedb/mcp-$plat@$version never appeared on the registry"; exit 1; }
                  sleep 10
                done
              done
            fi
            # A rerun skips what an earlier attempt already published.
            name=$(node -p "require('./npm/$pkg/package.json').name")
            pkgver=$(node -p "require('./npm/$pkg/package.json').version")
            if [ "$(npm view "$name@$pkgver" version --prefer-online 2>/dev/null)" = "$pkgver" ]; then
              echo "$pkg: $pkgver already on the registry, skipping"
              continue
            fi
            (cd npm/$pkg && npm publish --access public 2>publish.err) || {
              cat npm/$pkg/publish.err
              if grep -qiE "EPUBLISHCONFLICT|cannot publish over|previously published|previously staged" npm/$pkg/publish.err; then
                echo "$pkg: already published, skipping"
              else
                exit 1
              fi
            }
          done

  verify:
    name: Verify install (${{ matrix.os }})
    needs: publish-npm
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every OS; one failure must not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Clean install runs the binary
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          # Registry edges lag a fresh publish by minutes, so a just published
          # version can be missing on one request and present on the next.
          # Retry from an empty cache; only a failure that persists is real.
          for i in $(seq 1 10); do
            export npm_config_cache="$RUNNER_TEMP/npm-cache-$i"
            npx -y --prefer-online "mentedb-mcp@$version" --help | grep -q "MCP server for MenteDB" && exit 0
            echo "attempt $i failed, retrying in 30s"
            sleep 30
          done
          echo "mentedb-mcp@$version did not install and run after 10 attempts"
          exit 1
      - name: Install without the platform package still runs
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          for i in $(seq 1 10); do
            dir=$(mktemp -d)
            if (cd "$dir" && npm init -y >/dev/null \
                && npm_config_cache="$dir/cache" npm install --omit=optional "mentedb-mcp@$version" >/dev/null \
                && HOME="$dir/home" USERPROFILE="$dir/home" npx mentedb-mcp --help | grep -q "MCP server for MenteDB"); then
              exit 0
            fi
            echo "attempt $i failed, retrying in 30s"
            sleep 30
          done
          echo "install without the platform package failed after 10 attempts"
          exit 1
